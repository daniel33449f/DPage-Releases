name: Temporary build DPage hotfix

on:
  push:
    branches: [temp-build-hotfix-20260923]
    paths:
      - '.github/workflows/temp-build-hotfix.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release staging branch
        uses: actions/checkout@v4

      - name: Checkout approved PLOTAPP commit
        uses: actions/checkout@v4
        with:
          repository: daniel33449f/PLOTAPP
          token: ${{ secrets.PLOTAPP_READ_TOKEN }}
          ref: 47326040a26fe76055b33715246f854d89ba8fb6
          path: plotapp
          sparse-checkout: |
            extracted/DPlot-app-source/DPlot-app
            extracted/DPlot-assets/app/DPlot-app
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: plotapp/extracted/DPlot-app-source/DPlot-app/requirements.txt

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "plotapp/extracted/DPlot-app-source/DPlot-app/requirements.txt"
          python -m pip install nuitka ordered-set zstandard pillow

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Prepare DPage RC5 branding
        shell: pwsh
        run: |
          $src = "plotapp/extracted/DPlot-app-source/DPlot-app"
          python "$src/generate_dpage_icon.py"
          if (-not (Test-Path "$src/DPage.ico")) { throw "Official DPage.ico was not generated." }
          $ui = Get-Content "$src/app_interface.py" -Raw
          $ui = $ui.Replace('1.0 RC1','1.1 RC5').Replace('1.0-rc1','1.1-rc5').Replace('1.1 RC2','1.1 RC5').Replace('1.1-rc2','1.1-rc5').Replace('1.1 RC3','1.1 RC5').Replace('1.1-rc3','1.1-rc5').Replace('1.1 RC4','1.1 RC5').Replace('1.1-rc4','1.1-rc5')
          Set-Content "$src/app_interface.py" $ui -Encoding UTF8

      - name: Build and smoke test installer
        shell: pwsh
        run: |
          $src = (Resolve-Path "plotapp/extracted/DPlot-app-source/DPlot-app").Path
          $python = (Get-Command python).Source
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "C:\Program Files\NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) { throw "makensis.exe not found" }
          $build = Join-Path $env:RUNNER_TEMP "dplot-temp-build-$env:GITHUB_RUN_ID"
          $release = Join-Path $env:RUNNER_TEMP "dplot-temp-release-$env:GITHUB_RUN_ID"
          & "$src/build-public.ps1" -Python $python -MakeNsis $makensis -BuildRoot $build -ReleaseRoot $release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $release "DPage-Setup-1.1-rc5.exe"
          if (-not (Test-Path $installer)) { throw "RC5 installer was not generated." }
          Copy-Item $installer "$env:GITHUB_WORKSPACE/DPage-Setup-hotfix.exe"
          (Get-FileHash $installer -Algorithm SHA256).Hash | Set-Content "$env:GITHUB_WORKSPACE/DPage-Setup-hotfix.sha256.txt"

      - name: Commit temporary installer for handoff
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DPage-Setup-hotfix.exe DPage-Setup-hotfix.sha256.txt
          git commit -m "temp: stage approved DPage hotfix installer"
          git push origin HEAD:temp-build-hotfix-20260923

name: Publish validated DPage installer once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-installer.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7184-820e-b6f8-2a0b66227797/raw?se=2026-09-19T22%3A01%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=90f2aa6e-fb1c-55e7-a53f-76d7f575a528&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T12%3A40%3A34Z&ske=2026-09-20T12%3A40%3A34Z&sks=b&skv=2026-02-06&sig=PwM9z7s0bQgs3AS44c33Ims1DRpb2XIFKz0jd8hCclg%3D' -o artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/DPage-Setup-1.1-rc5.exe
          test -f artifact/DPage-Setup-1.1-rc5.sha256.txt

      - name: Verify installer SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(tr -d '[:space:]' < artifact/DPage-Setup-1.1-rc5.sha256.txt | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$(sha256sum artifact/DPage-Setup-1.1-rc5.exe | awk '{print toupper($1)}')"
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "BA08FCAD3D7A94F13D7004416CB5254C87B5CDE24985260D05CF699B00F28AB7"
          cp artifact/DPage-Setup-1.1-rc5.exe DPage-Setup.exe
          printf '%s  %s\n' "$ACTUAL" "DPage-Setup.exe" > DPage-Setup.exe.sha256.txt
          echo "Validated SHA-256: $ACTUAL"

      - name: Replace public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.1-rc5 DPage-Setup.exe DPage-Setup.exe.sha256.txt --clobber
          echo "Published DPage-Setup.exe"

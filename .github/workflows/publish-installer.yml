name: Publish DPage installer manually

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "ID do build aprovado do PLOTAPP (branch main)"
        required: true
        type: string
      expected_sha256:
        description: "SHA-256 esperado do DPage-Setup-1.1-rc5.exe"
        required: true
        type: string
      publish_release:
        description: "Publicar/substituir os arquivos da release pública"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source build metadata
        env:
          GH_TOKEN: ${{ secrets.PLOTAPP_READ_TOKEN }}
          RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          META="$(gh api "repos/daniel33449f/PLOTAPP/actions/runs/$RUN_ID")"
          test "$(jq -r '.conclusion' <<<"$META")" = "success"
          test "$(jq -r '.head_branch' <<<"$META")" = "main"
          test "$(jq -r '.path' <<<"$META")" = ".github/workflows/build-dplot-rc2.yml"
          echo "Validated PLOTAPP run $RUN_ID"

      - name: Download exact validated artifact
        env:
          GH_TOKEN: ${{ secrets.PLOTAPP_READ_TOKEN }}
          RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download "$RUN_ID"             -R daniel33449f/PLOTAPP             -n DPage-Setup-1.1-rc5             -D artifact
          test -f artifact/DPage-Setup-1.1-rc5.exe
          test -f artifact/DPage-Setup-1.1-rc5.sha256.txt

      - name: Verify installer SHA-256
        env:
          INPUT_SHA: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_INPUT="$(printf '%s' "$INPUT_SHA" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_FILE="$(tr -d '[:space:]' < artifact/DPage-Setup-1.1-rc5.sha256.txt | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$(sha256sum artifact/DPage-Setup-1.1-rc5.exe | awk '{print toupper($1)}')"
          test "$EXPECTED_INPUT" = "$EXPECTED_FILE"
          test "$EXPECTED_INPUT" = "$ACTUAL"
          cp artifact/DPage-Setup-1.1-rc5.exe DPage-Setup.exe
          printf '%s  %s\n' "$ACTUAL" "DPage-Setup.exe" > DPage-Setup.exe.sha256.txt
          echo "Validated SHA-256: $ACTUAL"

      - name: Publish public release only when explicitly requested
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.1-rc5             DPage-Setup.exe             DPage-Setup.exe.sha256.txt             --clobber             -R daniel33449f/DPage-Releases
          echo "Published DPage-Setup.exe manually"

      - name: Dry-run confirmation
        if: ${{ !inputs.publish_release }}
        shell: bash
        run: |
          echo "Validation only. Public release was NOT modified."
